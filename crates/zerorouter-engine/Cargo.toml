[package]
name = "zerorouter-engine"
version = "0.1.0"
description = "0router request engine: accounts, keys, attempt loop, upstream client, records"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
testkit = ["dep:axum"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
futures-util.workspace = true
bytes.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
aho-corasick.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
arc-swap.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
indexmap.workspace = true
zerorouter-wire.workspace = true
zerorouter-registry.workspace = true
axum = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["test-util"] }
zerorouter-engine = { path = ".", features = ["testkit"] }

[[bench]]
name = "engine"
harness = false

[lints]
workspace = true
