# ---- Latency, last 24 hours: [2026-10-06T12:00:00Z, 2026-10-07T12:00:00Z) ----------------------
# Records with an agent: fx04 fx05 fx06 fx07 fx08 fx09 fx10 fx11 fx13 fx14 fx15 (fx12 has none;
# fx01..fx03 are older). Router overhead = `started` of the first attempt that isn't skipped:
#   fx04 4, fx05 4, fx06 5, fx07 6, fx08 4, fx09 5, fx10 6, fx11 7, fx13 3, fx14 4, fx15 5 (not
#   the skipped one at 1.0).
# Client TTFT = ttft_ms: fx04 800, fx05 200, fx06 600, fx07 350, fx08 250, fx09 1400, fx10 300,
#   fx11 1500, fx13 100; fx14 and fx15 have none.
# Nearest rank: v[ceil(q*n) - 1] over the sorted values.

[latency]
at = "2026-10-07T12:00:00Z"

[latency.agents.ak_alice]       # fx05 fx07 fx08 fx09 fx14
requests = 5
overhead = { p50 = 4.0, p95 = 6.0, n = 5 }     # [4,4,4,5,6]: ceil(2.5)=3 -> 4; ceil(4.75)=5 -> 6
ttft = { p50 = 250.0, p95 = 1400.0, n = 4 }    # [200,250,350,1400]: ceil(2)=2 -> 250; ceil(3.8)=4 -> 1400
last = { result = "resolved", at = "2026-10-07T01:00:04Z" }   # fx09, 01:00:00 + 4000 ms; fx14 cancelled is ignored

[latency.agents.ak_bob]         # fx04 fx06 fx10 fx11 fx15
requests = 5
overhead = { p50 = 5.0, p95 = 7.0, n = 5 }     # [4,5,5,6,7]: 3rd -> 5; 5th -> 7
ttft = { p50 = 600.0, p95 = 1500.0, n = 4 }    # [300,600,800,1500]: 2nd -> 600; 4th -> 1500
last = { result = "resolved", at = "2026-10-07T05:00:04Z" }   # fx11; fx15 is unfinished

[latency.agents.ak_carol]       # fx13
requests = 1
overhead = { p50 = 3.0, p95 = 3.0, n = 1 }
ttft = { p50 = 100.0, p95 = 100.0, n = 1 }
last = { result = "resolved", at = "2026-10-07T08:00:01Z" }

# Provider rows. Requests = records with a non-skipped attempt on it. Own TTFT = ttft_ms less the
# start of the last non-skipped attempt with started <= ttft_ms, credited to that attempt's provider.
#   fx08 alpha 250-4=246; fx09 alpha (attempt 2, started 1010) 1400-1010=390; fx10 alpha attempt 1
#   (attempt 2 started 2100 > 300) 300-6=294; fx11 beta attempt 2 (started 1100) 1500-1100=400;
#   fx13 alpha 100-3=97; fx04 beta 800-4=796; fx05 beta 200-4=196; fx06 gamma 600-5=595;
#   fx07 delta 350-6=344.

[latency.providers.alpha]       # fx08 fx09 fx10 fx11 fx13 fx14 fx15
requests = 7
own_ttft = { p50 = 246.0, p95 = 390.0, n = 4 }   # [97,246,294,390]: 2nd -> 246; 4th -> 390
agents = { ak_alice = 3, ak_bob = 3, ak_carol = 1 }
last = { result = "resolved", at = "2026-10-07T08:00:01Z" }   # fx13's attempt, newest ok/failed (fx14's is cancelled, fx15's has no outcome)

[latency.providers.beta]        # fx04 fx05 fx11
requests = 3
own_ttft = { p50 = 400.0, p95 = 796.0, n = 3 }   # [196,400,796]: ceil(1.5)=2 -> 400; ceil(2.85)=3 -> 796
agents = { ak_alice = 1, ak_bob = 2 }
last = { result = "resolved", at = "2026-10-07T05:00:04Z" }   # fx11 attempt 2

[latency.providers.gamma]       # fx06 fx09
requests = 2
own_ttft = { p50 = 595.0, p95 = 595.0, n = 1 }   # fx09's first token came from alpha, so only fx06 counts
agents = { ak_alice = 1, ak_bob = 1 }
last = { result = "failed", at = "2026-10-07T01:00:01Z", status = 503 }   # fx09 attempt 1, after fx06's ok at 10-06 18:00:03

[latency.providers.delta]       # fx07
requests = 1
own_ttft = { p50 = 344.0, p95 = 344.0, n = 1 }
agents = { ak_alice = 1 }
last = { result = "resolved", at = "2026-10-06T19:00:03Z" }
