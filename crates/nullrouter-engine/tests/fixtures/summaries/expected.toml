# Hand-worked figures for the records in records/*.jsonl, with the prices in prices.toml.
# `at` = 2026-10-07T12:00:00Z. Windows are [from, to). Tokens: input = uncached input (cache reads
# out; cache writes stay in), cached = cache reads, output as reported. Cost per million tokens.
#
# Records (agent, arrival UTC, served by, usage -> tokens (input, cached, output), cost):
#  fx01 alice 10-05 10:00 alpha/main, peak 4/20/0.4/5. includes_cache: in 1,000,000 incl. 600,000
#       read, 0 write, out 100,000 -> (400,000, 600,000, 100,000).
#       cost = 0.4*4 + 0.6*0.4 + 0.1*20 = 1.6 + 0.24 + 2.0 = 3.84
#  fx02 bob   10-05 22:00 alpha/main, off-peak 2/10/0.2/2.5. excludes_cache: in 200,000, read
#       300,000, write 100,000, out 50,000 -> input 200,000 + 100,000 write = 300,000, cached
#       300,000, output 50,000.
#       cost = 0.2*2 + 0.3*0.2 + 0.1*2.5 + 0.05*10 = 0.4 + 0.06 + 0.25 + 0.5 = 1.21
#  fx03 alice 10-06 09:00 alpha/override flat 1/3. includes_cache: in 500,000 incl. 100,000 read,
#       out 20,000 -> (400,000, 100,000, 20,000). No cache rate: reads at the input rate.
#       cost = 0.4*1 + 0.1*1 + 0.02*3 = 0.4 + 0.1 + 0.06 = 0.56
#  fx04 bob   10-06 15:00 beta/main, 3 in, no output rate. in 100,000, out 10,000 -> (100,000, 0,
#       10,000). UNPRICED no_output_price.
#  fx05 alice 10-06 16:00 beta/main. in 50,000, out 0 -> (50,000, 0, 0). Output 0 needs no output
#       rate. cost = 0.05*3 = 0.15
#  fx06 bob   10-06 18:00 gamma/main (no price). in 80,000, out 8,000. UNPRICED no_price.
#  fx07 alice 10-06 19:00 delta/ghost (account gone). in 60,000, out 6,000. UNPRICED account_gone.
#  fx08 alice 10-06 23:30 alpha/main, usage null -> not reported, no tokens, no cost.
#  fx09 alice 10-07 01:00 alpha/main after gamma failed (503). off-peak. in 100,000, out 40,000.
#       cost = 0.1*2 + 0.04*10 = 0.2 + 0.4 = 0.6
#  fx10 bob   10-07 03:00 alpha/main, a continuation (attempt 2). in 70,000, out 30,000.
#       cost = 0.07*2 + 0.03*10 = 0.14 + 0.3 = 0.44
#  fx11 bob   10-07 05:00 beta/main after alpha failed (500): a restart. in 40,000, out 0.
#       cost = 0.04*3 = 0.12
#  fx12 (no agent) 10-07 06:00 refused before a key matched: no usage -> not reported.
#  fx13 carol 10-07 08:00 alpha/main. 08:00 is inside the peak window [08:00, 20:00): 4/20.
#       in 10,000, out 2,000. cost = 0.01*4 + 0.002*20 = 0.04 + 0.04 = 0.08
#  fx14 alice 10-07 11:00 cancelled, no usage -> not reported.
#  fx15 bob   10-07 11:55 in progress (a skipped gamma attempt, then alpha): in flight.

