[package]
name = "nullrouter-engine"
version = "0.1.0"
description = "0router request engine: accounts, keys, attempt loop, upstream client, records"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# `parity` lets tests open the registry with the fit check off (`Engine::open_parity`).
testkit = ["dep:axum", "dep:tempfile", "nullrouter-registry/parity", "nullrouter-adapters/testkit"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
futures-util.workspace = true
bytes.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
aho-corasick.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
arc-swap.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
httpdate.workspace = true
indexmap.workspace = true
url.workspace = true
tower.workspace = true
nullrouter-wire.workspace = true
nullrouter-registry.workspace = true
nullrouter-adapters.workspace = true
nullrouter-adapter-kit.workspace = true
axum = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
wat = "1"
nullrouter-sandbox.workspace = true
tempfile.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["test-util"] }
nullrouter-engine = { path = ".", features = ["testkit"] }
nullrouter-adapters = { workspace = true, features = ["testkit"] }
# The connect-attribution spike (tests/connect_attribution.rs): a local TLS server and CONNECT proxy.
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "records_page"
harness = false

[[bench]]
name = "keys_last_used_100k"
harness = false

[[bench]]
name = "usage_totals_100k"
harness = false

[[bench]]
name = "latency_24h_100k"
harness = false

[lints]
workspace = true
