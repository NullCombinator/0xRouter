# A minimal implicit-block style for the generic codec tests (T029). Not a real API.
schema = 1
kind = "api-style"
id = "minichat"

[access_key]
carriers = [{ header = "authorization", scheme = "bearer" }]

[[routes]]
method = "POST"
path = "/minichat/completions"
op = "generate"
type = "text"
model = { body = "model" }
stream = { body = "stream" }

[text.layout]
system = "first_message"
messages = "messages"
content = "content"
content_form = "string_when_text_only"
tool_calls = "message_field"
tool_results = "tool_role_message"
arguments = "json_string"
alternation = "as_is"

[text.parts.text]
data = { type = "text", text = "{part.text}" }

[text.parts.image]
data = { type = "image_url", image_url = { url = "{media}" } }
codec = "data_url"

[text.parts.tool_call]
data = { id = "{call.id}", type = "function", function = { name = "{call.name}", arguments = "{call.arguments}" } }

[text.parts.tool_result]
data = { role = "tool", tool_call_id = "{result.id}", content = "{result.content}" }

[text.tools]
data = { type = "function", function = { name = "{tool.name}", description = "{tool.description?}", parameters = "{tool.parameters}" } }
choice = { path = "tool_choice", auto = "auto", required = "required", none = "none", named = { type = "function", function = { name = "{tool.name}" } } }

[text.params]
max_tokens = "max_tokens"
temperature = "temperature"
thinking = { path = "reasoning_effort", form = "effort" }

[text.finish]
stop = "stop"
length = "length"
tool_calls = "tool_calls"
content_filter = "content_filter"
error = "error"

[text.usage]
input = "usage.prompt_tokens"
output = "usage.completion_tokens"
cache_read = "usage.prompt_tokens_details.cached_tokens"
input_semantics = "includes_cache"

[text.response]
id_prefix = "chatcmpl-"
body = { id = "{response.id}", object = "chat.completion", created = "{response.created}", model = "{response.model}", choices = [{ index = 0, message = { role = "assistant", content = "{response.text?}", tool_calls = "{response.tool_calls?}" }, finish_reason = "{response.finish}" }], usage = { prompt_tokens = "{usage.input?}", completion_tokens = "{usage.output?}" } }

[text.stream]
framing = "sse_data_done"
blocks = "implicit"
tool_arguments = "fragments"

[[text.stream.events]]
on = "preamble"
data = { id = "{response.id}", object = "chat.completion.chunk", model = "{response.model}", choices = [{ index = 0, delta = { role = "assistant", content = "" } }] }

[[text.stream.events]]
on = "text_delta"
data = { id = "{response.id}", object = "chat.completion.chunk", model = "{response.model}", choices = [{ index = 0, delta = { content = "{delta.text}" } }] }

[[text.stream.events]]
on = "block_start:tool_call"
data = { id = "{response.id}", object = "chat.completion.chunk", model = "{response.model}", choices = [{ index = 0, delta = { tool_calls = [{ index = "{tool.ordinal}", id = "{block.id}", type = "function", function = { name = "{block.name}", arguments = "" } }] } }] }

[[text.stream.events]]
on = "tool_arguments"
data = { id = "{response.id}", object = "chat.completion.chunk", model = "{response.model}", choices = [{ index = 0, delta = { tool_calls = [{ index = "{tool.ordinal}", function = { arguments = "{delta.arguments}" } }] } }] }

[[text.stream.events]]
on = "finish"
data = { id = "{response.id}", object = "chat.completion.chunk", model = "{response.model}", choices = [{ index = 0, delta = {}, finish_reason = "{finish}" }] }

[[text.stream.events]]
on = "usage"
when_request = "stream_options.include_usage"
data = { id = "{response.id}", object = "chat.completion.chunk", model = "{response.model}", choices = [], usage = { prompt_tokens = "{usage.input}", completion_tokens = "{usage.output}" } }

[errors]
body = { error = { type = "{error.type}", message = "{error.message}" }, nullrouter = "{error.details}" }
type_map = { 400 = "invalid_request_error", 401 = "invalid_api_key", 404 = "model_not_found", 429 = "rate_limit_exceeded", 500 = "server_error", 503 = "server_error" }
stream_event = { data = "{error.body}" }
