# A minimal explicit-block style for the generic codec tests (T029). Not a real API.
schema = 1
kind = "api-style"
id = "mini"

[access_key]
carriers = [{ header = "x-api-key", scheme = "raw" }]

[[routes]]
method = "POST"
path = "/mini/messages"
op = "generate"
type = "text"
model = { body = "model" }
stream = { body = "stream" }

[text.layout]
system = "top_level_field"
messages = "messages"
content = "content"
content_form = "string_when_text_only"
tool_calls = "content_part"
tool_results = "content_part"
arguments = "json_object"

[text.parts.text]
data = { type = "text", text = "{part.text}", cache_control = "{part.cache_control?}" }

[text.parts.image]
data = { type = "image", source = "{media}" }
codec = "anthropic_source"

[text.parts.tool_call]
data = { type = "tool_use", id = "{call.id}", name = "{call.name}", input = "{call.arguments}" }

[text.parts.tool_result]
data = { type = "tool_result", tool_use_id = "{result.id}", content = "{result.content}", is_error = "{result.is_error?}" }

[text.parts.thinking]
data = { type = "thinking", thinking = "{part.text}", signature = "{part.signature?}" }

[text.tools]
data = { name = "{tool.name}", description = "{tool.description?}", input_schema = "{tool.parameters}" }
choice = { path = "tool_choice", auto = { type = "auto" }, required = { type = "any" }, none = { type = "none" }, named = { type = "tool", name = "{tool.name}" } }

[text.params]
max_tokens = "max_tokens"
temperature = "temperature"
thinking = { path = "thinking", form = "budget_tokens" }

[text.finish]
end_turn = "stop"
max_tokens = "length"
tool_use = "tool_calls"
refusal = "content_filter"
error = "error"

[text.usage]
input = "usage.input_tokens"
output = "usage.output_tokens"
cache_read = "usage.cache_read_input_tokens"
input_semantics = "excludes_cache"

[text.response]
id_prefix = "msg_"
body = { id = "{response.id}", type = "message", role = "assistant", model = "{response.model}", content = "{response.content}", stop_reason = "{response.finish}", usage = { input_tokens = "{usage.input?}", output_tokens = "{usage.output?}", cache_read_input_tokens = "{usage.cache_read?}" } }

[text.stream]
framing = "sse_named"
blocks = "explicit"
tool_arguments = "fragments"

[[text.stream.events]]
on = "preamble"
event = "message_start"
data = { type = "message_start", message = { id = "{response.id}", model = "{response.model}" } }

[[text.stream.events]]
on = "block_start:text"
event = "content_block_start"
data = { type = "content_block_start", index = "{block.index}", content_block = { type = "text", text = "" } }

[[text.stream.events]]
on = "block_start:tool_call"
event = "content_block_start"
data = { type = "content_block_start", index = "{block.index}", content_block = { type = "tool_use", id = "{block.id}", name = "{block.name}" } }

[[text.stream.events]]
on = "text_delta"
event = "content_block_delta"
data = { type = "content_block_delta", index = "{block.index}", delta = { type = "text_delta", text = "{delta.text}" } }

[[text.stream.events]]
on = "tool_arguments"
event = "content_block_delta"
data = { type = "content_block_delta", index = "{block.index}", delta = { type = "input_json_delta", partial_json = "{delta.arguments}" } }

[[text.stream.events]]
on = "block_stop"
event = "content_block_stop"
data = { type = "content_block_stop", index = "{block.index}" }

[[text.stream.events]]
on = "finish"
event = "message_delta"
data = { type = "message_delta", delta = { stop_reason = "{finish}" }, usage = { output_tokens = "{usage.output?}" } }

[[text.stream.events]]
on = "done"
event = "message_stop"
data = { type = "message_stop" }

[errors]
body = { type = "error", error = { type = "{error.type}", message = "{error.message}" }, nullrouter = "{error.details}" }
type_map = { 400 = "invalid_request_error", 401 = "authentication_error", 404 = "not_found_error", 429 = "rate_limit_error", 500 = "api_error", 503 = "overloaded_error" }
stream_event = { event = "error", data = "{error.body}" }
keepalive = { event = "ping", data = { type = "ping" } }
