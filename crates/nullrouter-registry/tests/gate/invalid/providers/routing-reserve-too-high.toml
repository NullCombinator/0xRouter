# expect: reserve must be between 0% and 50%
schema = 2
id = "acme"
category = "apikey"

[auth]
kind = "apikey"
header = "x-acme-key"

[endpoints.text]
url = "https://api.acme.example/v1/messages"
wire = "anthropic-messages"

[[routing.window]]
name = "5-hour"
length = "5h"
unit = "requests"
capacity = 100
reserve = "60%"
