# expect: host usage.elsewhere.example is not one of this provider's hosts
schema = 2
id = "acme"
category = "apikey"

[endpoints.text]
url = "https://api.acme.example/v1/responses"
wire = "openai-responses"

[signin]
flow = "device_code"
client_id = "b1a00492-073a-47ea-816f-4c329264a828"
scopes = ["openid", "offline_access"]
device_url = "https://auth.acme.example/oauth2/device/code"
token_url = "https://auth.acme.example/oauth2/token"
refresh_lead = "5m"

[quota]
accounts = "signin"
request = { url = "https://usage.elsewhere.example/v1/usage" }

[[quota.window]]
path = "five_hour"
name = "5-hour"
unit = "percent"
used = "utilization"
