# ── Translation (T043): `style = "<from>-to-<to>"`, 9router format names, `*` for any side.
# Fields are dotted paths; `*` matches one key or index, a last `**` everything under it.

# Requests, any target.

[[deviation]]
style = "*-to-*"
fixture = "tools"
field = "max_tokens"
reason = "the client's output limit is kept; 9router raises it to 32000 when tools are declared"

[[deviation]]
style = "*-to-*"
fixture = "tools"
field = "max_output_tokens"
reason = "the client's output limit is kept; 9router raises it to 32000 when tools are declared"

[[deviation]]
style = "*-to-*"
fixture = "tools"
field = "generationConfig.maxOutputTokens"
reason = "the client's output limit is kept; 9router raises it to 32000 when tools are declared"

[[deviation]]
style = "*-to-*"
fixture = "tools"
field = "tool_choice"
reason = "the client's tool choice is carried (R4); 9router drops Gemini's functionCallingConfig"

[[deviation]]
style = "gemini-to-*"
fixture = "tools"
field = "messages.*"
reason = "text after a Gemini functionResponse is kept (R4, never truncate); 9router drops it"

[[deviation]]
style = "gemini-to-*"
fixture = "tools"
field = "input.*"
reason = "text after a Gemini functionResponse is kept (R4, never truncate); 9router drops it"

[[deviation]]
style = "gemini-to-claude"
fixture = "tools"
field = "messages.*.content.*"
reason = "text after a Gemini functionResponse is kept (R4, never truncate); 9router drops it"

[[deviation]]
style = "gemini-to-*"
fixture = "tools"
field = "**"
reason = "Gemini calls carry no id: 0router numbers them (call_<name>_<n>) so repeated calls to one function stay paired; 9router names them call_<name>. A { result } response is carried as its text, not as a JSON string"

[[deviation]]
style = "*-to-*"
fixture = "images"
field = "**"
reason = "URL images are carried (R4, never truncate) and no detail: auto is added; 9router drops a URL image for some targets and adds detail"

[[deviation]]
style = "*-to-*"
fixture = "thinking"
field = "**"
reason = "the client's thinking setting is carried in the target's own field (R4); thinking text crosses vendors only unsigned and never as answer text, and a foreign signature is dropped; 9router drops the setting and replays reasoning as text or a foreign field"

[[deviation]]
style = "*-to-*"
fixture = "response_format"
field = "**"
reason = "structured output goes to the target's native field or the target is skipped (R4, CannotCarry); 9router copies the field under the source's name or writes a JSON instruction into the system prompt"

