name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The runner's 14 GB SSD is tight for target/; drop toolchains we never use.
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clone the 9router oracle
        run: CLAUDE_PROJECT_DIR=$PWD tools/cloud/session-start.sh
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
