name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  test:
    # Branches of this repo are tested on push; a PR event only adds runs for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The runner's 14 GB SSD is tight for target/; drop toolchains we never use.
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # Match the local toolchain, so CI and the laptop agree on lints; bump both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: clippy
          targets: wasm32-unknown-unknown
      # Save the cache even when tests fail, or every red run rebuilds from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Clone the 9router oracle
        run: CLAUDE_PROJECT_DIR=$PWD tools/cloud/session-start.sh
      - name: Test
        run: cargo test --workspace --no-fail-fast 2>&1 | tee test.log
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
      - name: Annotate failures
        if: failure()
        run: tools/ci/annotate.sh test.log clippy.log
