# OpenAI Responses (`/v1/responses`): Codex, the openai SDKs' `responses` API.
# contracts/api-style-schema.md; 9router oracle open-sse/translator/formats/openai-responses.js.
schema = 1
kind = "api-style"
id = "openai-responses"

[access_key]
carriers = [{ header = "authorization", scheme = "bearer" }]

# Codex sends `session_id`; other clients may pin their prompt cache with `prompt_cache_key`.
[session]
carriers = [{ header = "session_id" }, { path = "prompt_cache_key" }]

[[routes]]
method = "POST"
path = "/v1/responses"
op = "generate"
type = "text"
model = { body = "model" }
stream = { body = "stream" }

[[routes]]
method = "POST"
path = "/v1/responses/input_tokens"
op = "count_tokens"
type = "text"
model = { body = "model" }

[text.layout]
system = "instructions_field"
messages = "input"
content = "content"
content_form = "always_parts"
tool_calls = "output_item"
tool_results = "output_item"
arguments = "json_string"
alternation = "as_is"
message = { type = "message", role = "{message.role}", content = "{message.content}" }

[text.parts.text]
data = { type = "input_text", text = "{part.text}" }
roles = { assistant = { type = "output_text", text = "{part.text}" } }

[text.parts.image]
data = { type = "input_image", image_url = "{media}" }
codec = "data_url"

[text.parts.tool_call]
data = { type = "function_call", call_id = "{call.id}", name = "{call.name}", arguments = "{call.arguments}" }

[text.parts.tool_result]
data = { type = "function_call_output", call_id = "{result.id}", output = "{result.content}" }

# Reasoning is its own item. Its summary list may be empty, so decoding reads only the
# encrypted content; the text goes back out as one summary.
[text.parts.thinking]
data = { type = "reasoning", summary = [{ type = "summary_text", text = "{part.text}" }], encrypted_content = "{part.signature?}" }
match = { type = "reasoning", encrypted_content = "{part.signature?}" }

[text.tools]
data = { type = "function", name = "{tool.name}", description = "{tool.description?}", parameters = "{tool.parameters?}" }
choice = { path = "tool_choice", auto = "auto", required = "required", none = "none", named = { type = "function", name = "{tool.name}" } }

[text.params]
max_tokens = "max_output_tokens"
temperature = "temperature"
top_p = "top_p"
user = "user"
parallel_tool_calls = "parallel_tool_calls"
thinking = { path = "reasoning.effort", form = "effort" }
response_format = { path = "text.format", form = "responses_text_format" }

# Responses reports a status, not a finish reason. `tool_calls` never comes from the API;
# it is listed so every IR reason has a name, and a tool-call turn reads as tool calls anyway.
[text.finish]
completed = "stop"
incomplete = "length"
tool_calls = "tool_calls"
content_filter = "content_filter"
failed = "error"

[text.usage]
input = "usage.input_tokens"
output = "usage.output_tokens"
cache_read = "usage.input_tokens_details.cached_tokens"
reasoning = "usage.output_tokens_details.reasoning_tokens"
input_semantics = "includes_cache"

[text.response]
id_prefix = "resp_"
body = { id = "{response.id}", object = "response", created_at = "{response.created}", status = "{response.status}", model = "{response.model}", output = "{response.content}", usage = { input_tokens = "{usage.input?}", output_tokens = "{usage.output?}", total_tokens = "{usage.total?}", input_tokens_details = { cached_tokens = "{usage.cache_read?}" }, output_tokens_details = { reasoning_tokens = "{usage.reasoning?}" } } }

[text.count_tokens]
response = { object = "response.input_tokens", input_tokens = "{count.input}" }

[text.stream]
framing = "sse_named"
blocks = "explicit"
tool_arguments = "fragments"

# SDK accumulators index `output[output_index].content[content_index]`, so every item and
# content part is announced before its deltas and closed with its full text.

[[text.stream.events]]
on = "preamble"
event = "response.created"
data = { type = "response.created", sequence_number = "{sequence.number}", response = { id = "{response.id}", object = "response", created_at = "{response.created}", status = "in_progress", model = "{response.model}", output = [] } }
match = { type = "response.created", response = { id = "{response.id}", model = "{response.model?}" } }

[[text.stream.events]]
on = "preamble"
event = "response.in_progress"
data = { type = "response.in_progress", sequence_number = "{sequence.number}", response = { id = "{response.id}", object = "response", created_at = "{response.created}", status = "in_progress", model = "{response.model}", output = [] } }
match = { type = "response.in_progress", response = { id = "{response.id}", model = "{response.model?}" } }

# Text: a message item holding one output_text part.

[[text.stream.events]]
on = "block_start:text"
event = "response.output_item.added"
data = { type = "response.output_item.added", sequence_number = "{sequence.number}", output_index = "{output.index}", item = { id = "msg_{response.id}_{output.index}", type = "message", status = "in_progress", role = "assistant", content = [] } }
match = { type = "response.output_item.added", item = { type = "message" } }

[[text.stream.events]]
on = "block_start:text"
event = "response.content_part.added"
data = { type = "response.content_part.added", sequence_number = "{sequence.number}", item_id = "msg_{response.id}_{output.index}", output_index = "{output.index}", content_index = 0, part = { type = "output_text", text = "", annotations = [] } }
match = { type = "response.content_part.added", part = { type = "output_text" } }

[[text.stream.events]]
on = "text_delta"
event = "response.output_text.delta"
data = { type = "response.output_text.delta", sequence_number = "{sequence.number}", item_id = "msg_{response.id}_{output.index}", output_index = "{output.index}", content_index = 0, delta = "{delta.text}" }
match = { type = "response.output_text.delta", delta = "{delta.text}" }

[[text.stream.events]]
on = "block_stop:text"
event = "response.output_text.done"
data = { type = "response.output_text.done", sequence_number = "{sequence.number}", item_id = "msg_{response.id}_{output.index}", output_index = "{output.index}", content_index = 0, text = "{block.full_text}" }
match = { type = "response.output_text.done" }

[[text.stream.events]]
on = "block_stop:text"
event = "response.content_part.done"
data = { type = "response.content_part.done", sequence_number = "{sequence.number}", item_id = "msg_{response.id}_{output.index}", output_index = "{output.index}", content_index = 0, part = { type = "output_text", text = "{block.full_text}", annotations = [] } }
match = { type = "response.content_part.done", part = { type = "output_text" } }

[[text.stream.events]]
on = "block_stop:text"
event = "response.output_item.done"
data = { type = "response.output_item.done", sequence_number = "{sequence.number}", output_index = "{output.index}", item = { id = "msg_{response.id}_{output.index}", type = "message", status = "completed", role = "assistant", content = [{ type = "output_text", text = "{block.full_text}", annotations = [] }] } }
match = { type = "response.output_item.done", item = { type = "message" } }

# Reasoning: a reasoning item holding one summary part.

[[text.stream.events]]
on = "block_start:thinking"
event = "response.output_item.added"
data = { type = "response.output_item.added", sequence_number = "{sequence.number}", output_index = "{output.index}", item = { id = "rs_{response.id}_{output.index}", type = "reasoning", summary = [] } }
match = { type = "response.output_item.added", item = { type = "reasoning" } }

[[text.stream.events]]
on = "block_start:thinking"
event = "response.reasoning_summary_part.added"
data = { type = "response.reasoning_summary_part.added", sequence_number = "{sequence.number}", item_id = "rs_{response.id}_{output.index}", output_index = "{output.index}", summary_index = 0, part = { type = "summary_text", text = "" } }
match = { type = "response.reasoning_summary_part.added" }

[[text.stream.events]]
on = "thinking_delta"
event = "response.reasoning_summary_text.delta"
data = { type = "response.reasoning_summary_text.delta", sequence_number = "{sequence.number}", item_id = "rs_{response.id}_{output.index}", output_index = "{output.index}", summary_index = 0, delta = "{delta.thinking}" }
match = { type = "response.reasoning_summary_text.delta", delta = "{delta.thinking}" }

[[text.stream.events]]
on = "block_stop:thinking"
event = "response.reasoning_summary_text.done"
data = { type = "response.reasoning_summary_text.done", sequence_number = "{sequence.number}", item_id = "rs_{response.id}_{output.index}", output_index = "{output.index}", summary_index = 0, text = "{block.full_text}" }
match = { type = "response.reasoning_summary_text.done" }

[[text.stream.events]]
on = "block_stop:thinking"
event = "response.reasoning_summary_part.done"
data = { type = "response.reasoning_summary_part.done", sequence_number = "{sequence.number}", item_id = "rs_{response.id}_{output.index}", output_index = "{output.index}", summary_index = 0, part = { type = "summary_text", text = "{block.full_text}" } }
match = { type = "response.reasoning_summary_part.done" }

[[text.stream.events]]
on = "block_stop:thinking"
event = "response.output_item.done"
data = { type = "response.output_item.done", sequence_number = "{sequence.number}", output_index = "{output.index}", item = { id = "rs_{response.id}_{output.index}", type = "reasoning", summary = [{ type = "summary_text", text = "{block.full_text}" }], encrypted_content = "{block.signature?}" } }
match = { type = "response.output_item.done", item = { type = "reasoning" } }

# Tool calls: a function_call item.

[[text.stream.events]]
on = "block_start:tool_call"
event = "response.output_item.added"
data = { type = "response.output_item.added", sequence_number = "{sequence.number}", output_index = "{output.index}", item = { id = "fc_{block.id}", type = "function_call", status = "in_progress", call_id = "{block.id}", name = "{block.name}", arguments = "" } }
match = { type = "response.output_item.added", item = { type = "function_call", call_id = "{block.id}", name = "{block.name}" } }

[[text.stream.events]]
on = "tool_arguments"
event = "response.function_call_arguments.delta"
data = { type = "response.function_call_arguments.delta", sequence_number = "{sequence.number}", item_id = "fc_{block.id}", output_index = "{output.index}", delta = "{delta.arguments}" }
match = { type = "response.function_call_arguments.delta", delta = "{delta.arguments}" }

[[text.stream.events]]
on = "block_stop:tool_call"
event = "response.function_call_arguments.done"
data = { type = "response.function_call_arguments.done", sequence_number = "{sequence.number}", item_id = "fc_{block.id}", output_index = "{output.index}", arguments = "{block.full_arguments}" }
match = { type = "response.function_call_arguments.done" }

[[text.stream.events]]
on = "block_stop:tool_call"
event = "response.output_item.done"
data = { type = "response.output_item.done", sequence_number = "{sequence.number}", output_index = "{output.index}", item = { id = "fc_{block.id}", type = "function_call", status = "completed", call_id = "{block.id}", name = "{block.name}", arguments = "{block.full_arguments}" } }
match = { type = "response.output_item.done", item = { type = "function_call" } }

# The end: the whole response, rendered from the answer so far. There is no separate
# terminator; the stream ends after this event.

[[text.stream.events]]
on = "finish"
event = "response.completed"
data = { type = "response.completed", sequence_number = "{sequence.number}", response = "{response.rendered}" }
match = { type = "response.completed", response = { status = "{finish}", usage = { input_tokens = "{usage.input?}", output_tokens = "{usage.output?}", input_tokens_details = { cached_tokens = "{usage.cache_read?}" }, output_tokens_details = { reasoning_tokens = "{usage.reasoning?}" } } } }

# Upstream failures. 0router's own error events use `[errors] stream_event`.

[[text.stream.events]]
on = "error"
event = "response.failed"
data = { type = "response.failed", sequence_number = "{sequence.number}", response = { id = "{response.id}", status = "failed", error = { code = "{error.type}", message = "{error.message}" } } }
match = { type = "response.failed", response = { error = { code = "{error.type?}", message = "{error.message}" } } }

[[text.stream.events]]
on = "error"
event = "error"
data = { type = "error", sequence_number = "{sequence.number}", code = "{error.type}", message = "{error.message}" }
match = { type = "error", code = "{error.type?}", message = "{error.message}" }

[errors]
body = { error = { message = "{error.message}", type = "{error.type}", code = "{error.code}", zerorouter = "{error.details}" } }
type_map = { 400 = "invalid_request_error", 401 = "invalid_request_error", 403 = "invalid_request_error", 404 = "invalid_request_error", 429 = "rate_limit_exceeded", 500 = "server_error", 502 = "server_error", 503 = "server_error" }
stream_event = { event = "response.failed", data = { type = "response.failed", response = { status = "failed", error = { code = "{error.type}", message = "{error.message}" } } } }
