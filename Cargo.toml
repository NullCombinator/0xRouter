[workspace]
members = ["crates/*"]
exclude = ["adapters"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
thiserror = "2"
arc-swap = "1.9"
url = "2.5"
regex-lite = "0.1"
indexmap = { version = "2", features = ["serde"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
criterion = "0.8"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "fs", "macros", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2", "multipart", "socks"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
bytes = "1"
memchr = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
aho-corasick = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
httpdate = "1"
maud = "0.27"
jiff = "0.2"
subtle = "2.6"
wasmtime = { version = "45", default-features = false, features = ["cranelift", "async", "pooling-allocator", "runtime"] }
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
flate2 = "1"
tar = "0.4"
semver = "1"
nullrouter-adapter-kit = { path = "crates/nullrouter-adapter-kit", version = "1.0.0" }
nullrouter-sandbox = { path = "crates/nullrouter-sandbox" }
nullrouter-adapters = { path = "crates/nullrouter-adapters" }
nullrouter-builder = { path = "crates/nullrouter-builder" }
nullrouter-registry = { path = "crates/nullrouter-registry" }
nullrouter-wire = { path = "crates/nullrouter-wire" }
nullrouter-engine = { path = "crates/nullrouter-engine" }
nullrouter-server = { path = "crates/nullrouter-server" }
nullrouter-dashboard = { path = "crates/nullrouter-dashboard" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Parsing 121 bundled plugins dominates load time, and the derived deserialisers live in
# nullrouter-registry. Optimising both keeps debug loads and the 200-reload test fast.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.nullrouter-registry]
opt-level = 1
