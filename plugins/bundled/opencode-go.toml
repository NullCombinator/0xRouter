# OpenCode Go (hand-maintained, schema 2; seed tools/gen-bundled/seeds/opencode-go.json).
schema = 2
id = "opencode-go"
category = "apikey"
alias = "opencode-go"
aliases = ["ocg"]
ui_alias = "ocg"

[auth]
kind = "apikey"
header = "Authorization"
scheme = "bearer"

# One endpoint per wire. Each model lists the wires it takes, native pair first.
# 9router streams Responses upstream always.

[[endpoints.text]]
url = "https://opencode.ai/zen/go/v1/chat/completions"
wire = "openai-chat"
vision = true

[[endpoints.text]]
url = "https://opencode.ai/zen/go/v1/messages"
wire = "anthropic-messages"
headers = { "anthropic-version" = "2023-06-01" }
auth = { header = "x-api-key", scheme = "raw" }
vision = true

[[endpoints.text]]
url = "https://opencode.ai/zen/go/v1/responses"
wire = "openai-responses"
force_stream = true
vision = true

[session]
header = "x-opencode-session"
derive = "ses_sha256_hex32"


# Usage windows (research R11): API-key accounts, percent used, as 9router's opencode-go.js.
[quota]
accounts = "key"
request = { url = "https://opencode.ai/zen/go/v1/usage" }

[[quota.window]]
path = "usage.rolling"
name = "rolling"
unit = "percent"
used = "percent"
resets_at = "resetsAt"

[[quota.window]]
path = "usage.weekly"
name = "weekly"
unit = "percent"
used = "percent"
resets_at = "resetsAt"

[[quota.window]]
path = "usage.monthly"
name = "monthly"
unit = "percent"
used = "percent"
resets_at = "resetsAt"

