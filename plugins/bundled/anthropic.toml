# Anthropic (hand-maintained, schema 2; seed tools/gen-bundled/seeds/anthropic.json).
schema = 2
id = "anthropic"
category = "apikey"
alias = "anthropic"
logo = "anthropic.png"

[auth]
kind = "apikey"
header = "x-api-key"
scheme = "raw"

# `anthropic-version` is the only static header: no Claude Code beta spoofing (R17).
[endpoints.text]
url = "https://api.anthropic.com/v1/messages"
wire = "anthropic-messages"
headers = { "anthropic-version" = "2023-06-01" }
vision = true

[endpoints.text.token_count]
url = "https://api.anthropic.com/v1/messages/count_tokens"

# These models accept a trailing assistant turn as a prefill.
[endpoints.text.continuation]
method = "assistant_prefill"
trim_trailing_whitespace = true
unless = ["thinking_enabled", "tool_call_in_progress"]
models = ["claude-sonnet-4-20250514", "claude-opus-4-20250514", "claude-3-5-sonnet-20241022"]

# Claude Pro/Max sign-in (slice 005): Claude Code's public PKCE client, no client secret.
# The hosted code page shows `code#state` to paste back; loopback is the fallback (research
# R4, live check L1). Every sign-in shows the terms warning (spec FR-004, Clarifications Q2).
[signin]
flow = "pkce"
client_id = "9d1c250a-e61b-44d9-88ed-5944d1962f5e"
scopes = ["org:create_api_key", "user:profile", "user:inference"]
authorize_url = "https://claude.ai/oauth/authorize"
token_url = "https://api.anthropic.com/v1/oauth/token"
redirect = [
    { uri = "https://console.anthropic.com/oauth/code/callback", kind = "code_page" },
    { uri = "http://localhost:0/callback", kind = "loopback" },
]
params = { code = "true" }
body = "json"
verifier_bytes = 32
refresh_lead = "4h"
auth = { header = "Authorization", scheme = "bearer" }
terms_warning = true

# Headers only; the request body is never changed (Clarifications Q1, Q3). `oauth-2025-04-20`
# is required for subscription tokens and is merged with the client's own beta list.
[identity.headers]
anthropic-beta = "oauth-2025-04-20"
User-Agent = "claude-cli/2.1.280 (external, sdk-cli)"
X-App = "cli"

# Subscription quota (research R11, R12): sign-in accounts only; an API-key account shows
# "quota not reported". Windows as 9router's claude.js reads them; percent used.
[quota]
accounts = "signin"
request = { url = "https://api.anthropic.com/api/oauth/usage", headers = { anthropic-beta = "oauth-2025-04-20", anthropic-version = "2023-06-01" } }

[[quota.window]]
path = "five_hour"
name = "5-hour"
unit = "percent"
used = "utilization"
resets_at = "resets_at"

[[quota.window]]
path = "seven_day"
name = "weekly"
unit = "percent"
used = "utilization"
resets_at = "resets_at"

[[quota.window]]
path = "seven_day_*"
name = "weekly {1}"
unit = "percent"
used = "utilization"
resets_at = "resets_at"

[[quota.window]]
path = "limits[*]"
where = { kind = "weekly_scoped" }
name = "weekly {scope.model.display_name|lower}"
unit = "percent"
used = "percent"
resets_at = "resets_at"

[forwarding.to_upstream]
headers = [
  { name = "anthropic-beta", merge = "append_csv", from_styles = ["anthropic-messages"] },
  { name = "anthropic-version", merge = "replace", from_styles = ["anthropic-messages"] },
]

[forwarding.to_client]
headers = ["request-id", "retry-after", "anthropic-ratelimit-*"]

[[models]]
id = "claude-sonnet-4-20250514"
name = "Claude Sonnet 4"

[[models]]
id = "claude-opus-4-20250514"
name = "Claude Opus 4"

[[models]]
id = "claude-3-5-sonnet-20241022"
name = "Claude 3.5 Sonnet"

[display]
name = "Anthropic"
icon = "smart_toy"
color = "#D97757"
text_icon = "AN"
website = "https://console.anthropic.com"
notice = { api_key_url = "https://console.anthropic.com/settings/keys" }
priority = 30

# Source: Anthropic prompt caching docs: a cache_control marker keeps the prefix up to it for 5 minutes (ttl "1h" extends it), and unmarked requests cache nothing.
[routing.cache]
mode = "explicit"
lifetime = "5m"

# Source: lengths from the provider's usage report (five_hour, seven_day, per-model seven_day).
# Capacities are not published; the report is percent, so each window counts out of 100 until 007
# fits one. Names match the [quota] windows above.
[[routing.window]]
name = "5-hour"
length = "5h"
unit = "weighted_tokens"

[[routing.window]]
name = "weekly"
length = "7d"
unit = "weighted_tokens"

[[routing.window]]
name = "weekly *"
length = "7d"
unit = "weighted_tokens"

# No [[routing.price]]: Anthropic's per-million prices run from $1 to $15 by model (9router's
# pricing table lists them), and the plugin schema prices a plugin, not a model, so no single
# default is honest. An API-key account ranks as price 1 until its operator sets a price.
