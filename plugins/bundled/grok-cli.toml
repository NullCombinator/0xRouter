# Grok CLI / Grok Build (hand-maintained, schema 2; written for slice 005 from the generated
# community file at ref/9router@39e36d3). Signed-in accounts only: device code at auth.x.ai,
# inference and billing at cli-chat-proxy.grok.com.
schema = 2
id = "grok-cli"
category = "apikey"
alias = "gcli"
aliases = ["grok-build", "gb"]

# The body goes upstream as the client sent it (spec FR-004c): no endpoint-level `force`
# until live check L3 shows the server needs one. Effort-suffixed model ids carry their
# effort, which the client asked for through the model id.
[endpoints.text]
url = "https://cli-chat-proxy.grok.com/v1/responses"
wire = "openai-responses"
force_stream = true
retry = { "429" = { retries = 2, delay_ms = 2000 }, "502" = { retries = 2, delay_ms = 1500 }, "503" = { retries = 2, delay_ms = 1500 } }

[signin]
flow = "device_code"
client_id = "b1a00492-073a-47ea-816f-4c329264a828"
scopes = ["openid", "profile", "email", "offline_access", "grok-cli:access", "api:access", "conversations:read", "conversations:write"]
device_url = "https://auth.x.ai/oauth2/device/code"
token_url = "https://auth.x.ai/oauth2/token"
params = { referrer = "grok-build" }
body = "form"
refresh_lead = "5m"
auth = { header = "Authorization", scheme = "bearer" }
# 9router's device request and token polls send the official CLI's pager agent
# (`src/lib/oauth/providers/grok-cli.js`); 0router sends it on refreshes too.
headers = { User-Agent = "grok-pager/0.2.93 grok-shell/0.2.93 (linux; x86_64)" }

[signin.profile]
url = "https://cli-chat-proxy.grok.com/v1/user"
headers = { User-Agent = "grok-pager/0.2.93 grok-shell/0.2.93 (linux; x86_64)", x-xai-token-auth = "xai-grok-cli", x-grok-client-version = "0.2.93" }
email = "email | id_token.email | id_token.preferred_username"
user_id = "userId | principalId"
tier = "subscriptionTier"

# The official CLI's identity (spec Clarifications Q3, Q5). Live check L3 narrows this to
# what the server needs.
[identity.headers]
User-Agent = "grok-shell/0.2.99 (linux; x86_64)"
x-grok-client-identifier = "grok-shell"
x-grok-client-version = "0.2.99"
x-grok-session-id = "{session.id}"
x-grok-conv-id = "{session.id}"
x-grok-req-id = "{request.id}"
x-grok-turn-idx = "{session.turn}"
x-grok-model-override = "{model.upstream}"
x-email = "{account.email}"
x-userid = "{account.user_id}"
x-grok-agent-id = "{install.id}"

[forwarding.to_client]
headers = ["retry-after", "x-ratelimit-*"]


# Grok Build credits (research R11, R12): the billing read, as 9router's grok-cli.js reads it
# (`config.x` before `x`, protobuf-JSON `{ val = n }` numbers); when it reports no window,
# the gRPC-web credits RPC on grok.com (core decoder `grpc_web_ratio`).
[quota]
accounts = "signin"
request = { url = "https://cli-chat-proxy.grok.com/v1/billing?format=credits", headers = { Accept = "application/json", x-xai-token-auth = "xai-grok-cli", x-grok-client-mode = "headless" } }

[[quota.window]]
path = "."
name = "monthly included"
unit = "credits"
limit = "config.monthlyLimit | config.monthly_limit | monthlyLimit | monthly_limit"
used = "config.includedUsed | config.included_used | includedUsed | included_used | config.totalUsed | config.total_used | totalUsed | total_used"
resets_at = "config.billingPeriodEnd | config.billing_period_end | config.currentPeriod.end | config.resetAt | config.resetsAt | config.periodEnd | billingPeriodEnd | billing_period_end | resetAt | resetsAt | periodEnd"
unwrap_val = true

[[quota.window]]
path = "."
name = "on-demand"
unit = "credits"
limit = "config.onDemandCap | onDemandCap"
used = "config.onDemandUsed | onDemandUsed"
resets_at = "config.billingPeriodEnd | config.billing_period_end | config.currentPeriod.end | config.resetAt | config.resetsAt | config.periodEnd | billingPeriodEnd | billing_period_end | resetAt | resetsAt | periodEnd"
unwrap_val = true

[[quota.window]]
path = "."
name = "prepaid"
unit = "credits"
limit = "config.prepaidBalance | prepaidBalance"
remaining = "config.prepaidBalance | prepaidBalance"
unwrap_val = true

[[quota.window]]
path = "."
name = "weekly SuperGrok"
unit = "percent"
used = "config.creditUsagePercent | config.credit_usage_percent | creditUsagePercent"
resets_at = "config.billingPeriodEnd | config.billing_period_end | config.currentPeriod.end | config.resetAt | config.resetsAt | config.periodEnd | billingPeriodEnd | billing_period_end | resetAt | resetsAt | periodEnd"
unwrap_val = true

[[quota.window]]
path = "credits"
name = "credits"
unit = "credits"
limit = "total | limit | cap | allocation | amount"
used = "used | spent | consumed"
remaining = "remaining | balance | left"
resets_at = "resetAt | resetsAt | end"
unwrap_val = true

[[quota.window]]
path = "creditBalance"
name = "credits"
unit = "credits"
limit = "total | limit | cap | allocation | amount"
used = "used | spent | consumed"
remaining = "remaining | balance | left"
resets_at = "resetAt | resetsAt | end"
unwrap_val = true

[[quota.window]]
path = "usage"
name = "credits"
unit = "credits"
limit = "total | limit | cap | allocation | amount"
used = "used | spent | consumed"
remaining = "remaining | balance | left"
resets_at = "resetAt | resetsAt | end"
unwrap_val = true

[[quota.window]]
path = "config.credits"
name = "credits"
unit = "credits"
limit = "total | limit | cap | allocation | amount"
used = "used | spent | consumed"
remaining = "remaining | balance | left"
resets_at = "resetAt | resetsAt | end"
unwrap_val = true

[[quota.window]]
path = "config.includedCredits"
name = "credits"
unit = "credits"
limit = "total | limit | cap | allocation | amount"
used = "used | spent | consumed"
remaining = "remaining | balance | left"
resets_at = "resetAt | resetsAt | end"
unwrap_val = true

[[quota.window]]
path = "config.subscriptionCredits"
name = "credits"
unit = "credits"
limit = "total | limit | cap | allocation | amount"
used = "used | spent | consumed"
remaining = "remaining | balance | left"
resets_at = "resetAt | resetsAt | end"
unwrap_val = true

[quota.fallback]
request = { url = "https://grok.com/grok_api_v2.GrokBuildBilling/GetGrokCreditsConfig", method = "POST", body = "grpc_web_empty", headers = { Accept = "application/grpc-web+proto", content-type = "application/grpc-web+proto", x-grpc-web = "1" } }
decoder = "grpc_web_ratio"
name = "weekly SuperGrok"
unit = "percent"

# The live model list (research R14): read with the first active sign-in account at start
# and every 6 h; listed models join the [[models]] below, which stay the list on failure.
[models_live]
url = "https://cli-chat-proxy.grok.com/v1/models"
headers = { Accept = "application/json", x-xai-token-auth = "xai-grok-cli", x-grok-client-mode = "headless" }
list = "data | models | results | ."
id = "id | model_id | modelId | model | slug | name"
name = "display_name | displayName | name"
context = "context_length | contextLength | context_window | contextWindow"
max_output = "max_output_tokens | maxOutputTokens"
type = "text"
refresh = "6h"

[[models]]
id = "grok-build"
name = "Grok Build"
context_length = 500000
max_output_tokens = 64000

[[models]]
id = "grok-4.5"
name = "Grok 4.5"

[[models]]
id = "grok-4.5-high"
name = "Grok 4.5 (High)"
upstream_id = "grok-4.5"
force = { "reasoning.effort" = "high" }
[[models]]
id = "grok-4.5-medium"
name = "Grok 4.5 (Medium)"
upstream_id = "grok-4.5"
force = { "reasoning.effort" = "medium" }
[[models]]
id = "grok-4.5-low"
name = "Grok 4.5 (Low)"
upstream_id = "grok-4.5"
force = { "reasoning.effort" = "low" }

[display]
name = "Grok CLI (Grok Build)"
icon = "auto_awesome"
color = "#1DA1F2"
text_icon = "GC"
website = "https://x.ai"
notice = { text = "Sign in with your xAI / Grok account (device code). Uses Grok Build subscription credits.", signup_url = "https://grok.com/supergrok" }
priority = 275

# Source: Grok Build follows xAI automatic prefix caching; lifetime assumed to match xAI's (5 minutes) until the live check (L7) says otherwise.
[routing.cache]
mode = "automatic"
lifetime = "5m"

# Source: lengths from the billing report (a monthly included allowance and SuperGrok's weekly
# percent). Capacities are not published; the report carries the limit or a percent, so none is
# declared. "on-demand" and "prepaid" are left undeclared: they are credit balances that admit
# while above their floor and never pace (007 fits them if they should).
[[routing.window]]
name = "monthly included"
length = "30d"
unit = "weighted_tokens"

[[routing.window]]
name = "weekly SuperGrok"
length = "7d"
unit = "weighted_tokens"
