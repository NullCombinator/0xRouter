# ElevenLabs (hand-maintained, schema 2; seed tools/gen-bundled/seeds/elevenlabs.json).
schema = 2
id = "elevenlabs"
category = "apikey"
alias = "el"

[auth]
kind = "apikey"
header = "xi-api-key"
scheme = "raw"

# The streaming path answers with the same audio as the plain one, relayed as it arrives.
# `voices[0]` is the default when the request names none; 9router's `model/voice` form
# also works. `output_format` stays the ElevenLabs default (mp3).
[endpoints.tts]
url = "https://api.elevenlabs.io/v1/text-to-speech/{voice}/stream"
body = { text = "{input.text}", model_id = "{model.upstream_id}", voice_settings = { stability = 0.5, similarity_boost = 0.75 } }
response = {}
voices = ["21m00Tcm4TlvDq8ikWAM"]

# Never sets `webhook`: the transcript comes back on the same request.
[endpoints.stt]
url = "https://api.elevenlabs.io/v1/speech-to-text"
encoding = "multipart"
body = { file = "{input.audio}", model_id = "{model.upstream_id}", language_code = "{input.language?}" }
response = { text = "text", language = "language_code" }
models = ["scribe_v2"]

[[models]]
id = "eleven_flash_v2_5"
name = "Flash v2.5 (Fastest)"
kind = "tts"

[[models]]
id = "eleven_turbo_v2_5"
name = "Turbo v2.5 (Fast)"
kind = "tts"

[[models]]
id = "eleven_multilingual_v2"
name = "Multilingual v2 (Quality)"
kind = "tts"

[[models]]
id = "eleven_monolingual_v1"
name = "Monolingual v1 (English)"
kind = "tts"

[[models]]
id = "scribe_v2"
name = "Scribe v2"
kind = "stt"

[display]
name = "ElevenLabs"
icon = "record_voice_over"
color = "#6C47FF"
text_icon = "EL"
website = "https://elevenlabs.io"
notice = { api_key_url = "https://elevenlabs.io/app/settings/api-keys" }
