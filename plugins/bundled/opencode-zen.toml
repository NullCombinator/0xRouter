# OpenCode Zen (hand-maintained, schema 2; seed tools/gen-bundled/seeds/opencode-zen.json).
schema = 2
id = "opencode-zen"
category = "apikey"
alias = "ocz"
aliases = ["opencode-zen"]
ui_alias = "ocz"
passthrough_models = true
models_fetcher = { url = "https://opencode.ai/zen/v1/models", kind = "opencode-free" }

[auth]
kind = "apikey"
header = "Authorization"
scheme = "bearer"

# One endpoint per wire. Each model lists the wires it takes, native pair first.
# 9router always streams upstream here: Zen refuses stream = false on free models.

[[endpoints.text]]
url = "https://opencode.ai/zen/v1/chat/completions"
wire = "openai-chat"
force_stream = true
vision = true

[[endpoints.text]]
url = "https://opencode.ai/zen/v1/messages"
wire = "anthropic-messages"
headers = { "anthropic-version" = "2023-06-01" }
auth = { header = "x-api-key", scheme = "raw" }
force_stream = true
vision = true

[[endpoints.text]]
url = "https://opencode.ai/zen/v1/responses"
wire = "openai-responses"
force_stream = true
vision = true

[session]
header = "x-opencode-session"
derive = "ses_time_base62"

