# OpenRouter (hand-maintained, schema 2; seed tools/gen-bundled/seeds/openrouter.json).
# Text only for now; the non-text endpoints come with their model types.
schema = 2
id = "openrouter"
category = "freeTier"
alias = "openrouter"
passthrough_models = true
models_fetcher = { url = "https://openrouter.ai/api/v1/models", kind = "openrouter-free" }

[auth]
kind = "apikey"
header = "Authorization"
scheme = "bearer"

# Any model id passes through, on either wire; a client's own style is tried first.
[[endpoints.text]]
url = "https://openrouter.ai/api/v1/chat/completions"
wire = "openai-chat"
vision = true

[[endpoints.text]]
url = "https://openrouter.ai/api/v1/messages"
wire = "anthropic-messages"
vision = true

[forwarding.to_client]
headers = ["retry-after", "x-ratelimit-*"]

[display]
name = "OpenRouter"
icon = "router"
color = "#F97316"
text_icon = "OR"
website = "https://openrouter.ai"
notice = { text = "Free tier: 27+ free models, no credit card needed, 200 req/day. After  0 credit: 1,000 req/day.", api_key_url = "https://openrouter.ai/settings/keys" }
priority = 10
has_free = true
