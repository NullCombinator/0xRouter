# OpenRouter (hand-maintained, schema 2; seed tools/gen-bundled/seeds/openrouter.json).
schema = 2
id = "openrouter"
category = "freeTier"
alias = "openrouter"
passthrough_models = true
models_fetcher = { url = "https://openrouter.ai/api/v1/models", kind = "openrouter-free" }

[auth]
kind = "apikey"
header = "Authorization"
scheme = "bearer"

# Any model id passes through, on either wire; a client's own style is tried first.
[[endpoints.text]]
url = "https://openrouter.ai/api/v1/chat/completions"
wire = "openai-chat"
vision = true

[[endpoints.text]]
url = "https://openrouter.ai/api/v1/messages"
wire = "anthropic-messages"
vision = true

# Non-text endpoints use the openai-chat style's per-type codecs (R16).
[endpoints.embeddings]
url = "https://openrouter.ai/api/v1/embeddings"
wire = "openai-chat"

[endpoints.image]
url = "https://openrouter.ai/api/v1/images"
wire = "openai-chat"

# The speech endpoint answers with audio bytes (pending the T087 live check).
[endpoints.tts]
url = "https://openrouter.ai/api/v1/audio/speech"
wire = "openai-chat"
voices = ["alloy", "ash", "ballad", "cedar", "coral", "echo", "fable", "marin", "nova", "onyx", "sage", "shimmer", "verse"]

# A job: submit here, then poll `{url}/{id}` and fetch `{url}/{id}/content`.
[endpoints.video]
url = "https://openrouter.ai/api/v1/videos"
wire = "openai-chat"

[forwarding.to_client]
headers = ["retry-after", "x-ratelimit-*"]

[[models]]
id = "openai/text-embedding-3-large"
name = "OpenAI Text Embedding 3 Large"
kind = "embedding"

